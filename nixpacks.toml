# Railway/Nixpacks build config
# Build frontend, copy dist into backend/static, install python deps.

[phases.install]
cmds = [
  "cd frontend && npm install",
  "cd .. && pip install -r backend/requirements.txt"
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  "cd .. && mkdir -p backend/static && cp -r frontend/dist/* backend/static/"
]

[start]
cmd = "cd backend && PYTHONPATH=. uvicorn app.main:app --host 0.0.0.0 --port $PORT"
