# nginx config: serve frontend static + reverse-proxy /api to uvicorn
server {
    listen 80;
    server_name _;

    # Frontend SPA
    root /app/static;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy to backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;   # companion LLM call can take ~30s
    }
}
